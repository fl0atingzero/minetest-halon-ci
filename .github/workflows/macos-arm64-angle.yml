name: macos-arm64-angle

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ANGLE_PR: "15451"
  XCODE_VERSION: "16.2"
  MACOS_DEPLOYMENT_TARGET: "12.3"
  DEPS_DIR: /Users/Shared/macos12.3_arm64_angle_deps

jobs:
  build-arm64-angle:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Select Xcode
        run: |
          set -euo pipefail
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      - name: Clone Minetest from Codeberg
        run: git clone --depth 1 https://codeberg.org/halon/Minetest.git minetest

      - name: Get Minetest commit
        id: mtsha
        working-directory: minetest
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Apply upstream ANGLE PR
        id: anglesha
        working-directory: minetest
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 \
            --output angle-pr.patch \
            "https://github.com/luanti-org/luanti/pull/${ANGLE_PR}.patch"
          ANGLE_SHA="$(awk '/^From / { sha=$2 } END { print substr(sha, 1, 12) }' angle-pr.patch)"
          test -n "$ANGLE_SHA"
          git apply --whitespace=nowarn angle-pr.patch
          echo "sha=$ANGLE_SHA" >> "$GITHUB_OUTPUT"

      - name: Apply repository patch
        working-directory: minetest
        run: git apply ../macos/patch.diff

      - name: Clone mcl_localplayer mod
        working-directory: minetest
        run: |
          git clone --depth 1 https://codeberg.org/halon/mcl_localplayer.git clientmods/mcl_localplayer
          echo "load_mod_mcl_localplayer = true" > clientmods/mods.conf

      - name: Install ANGLE dependencies
        run: |
          set -euo pipefail
          DEPS_ARCHIVE="/Users/Shared/macos12.3_arm64_angle_deps.tar.gz"
          curl --fail --location --retry 3 \
            --output "$DEPS_ARCHIVE" \
            https://github.com/luanti-org/luanti_macos_deps/releases/download/latest/macos12.3_arm64_angle_deps.tar.gz
          tar -xf "$DEPS_ARCHIVE" -C /Users/Shared

      - name: Append clientmods copy to Xcode resources
        working-directory: minetest
        run: |
          cat >> util/xcode/install_resources.cmake <<'CMAKE_SNIPPET'
          execute_process(
            COMMAND ${CMAKE_COMMAND} -E copy_directory
            "$ENV{SOURCE_ROOT}/clientmods"
            "${RESOURCES_DIR}/clientmods"
          )
          CMAKE_SNIPPET

      - name: Build with Xcode
        working-directory: minetest
        run: |
          set -euo pipefail
          mkdir build_xcode
          cd build_xcode

          cmake .. \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
            -DCMAKE_FIND_FRAMEWORK=LAST \
            -DCMAKE_PREFIX_PATH="$DEPS_DIR" \
            -DRUN_IN_PLACE=FALSE -DENABLE_GETTEXT=TRUE \
            -DUSE_SDL2_STATIC=TRUE \
            -DENABLE_OPENGL3=OFF \
            -DENABLE_GLES2=ON \
            -DUSE_ANGLE=ON \
            -DOPENGLES2_LIBRARY="$DEPS_DIR/lib/libGLESv2_static.a" \
            -DOPENGL_INCLUDE_DIR="$DEPS_DIR/include/ANGLE" \
            -DSDL2_INCLUDE_DIRS="$DEPS_DIR/include/SDL2" \
            -DFREETYPE_LIBRARY="$DEPS_DIR/lib/libfreetype.a" \
            -DFREETYPE_INCLUDE_DIRS="$DEPS_DIR/include/freetype2" \
            -DGETTEXT_INCLUDE_DIR="$DEPS_DIR/include" \
            -DGETTEXT_LIBRARY="$DEPS_DIR/lib/libintl.a" \
            -DLUA_LIBRARY="$DEPS_DIR/lib/libluajit-5.1.a" \
            -DLUA_INCLUDE_DIR="$DEPS_DIR/include/luajit-2.1" \
            -DOGG_LIBRARY="$DEPS_DIR/lib/libogg.a" \
            -DOGG_INCLUDE_DIR="$DEPS_DIR/include" \
            -DVORBIS_LIBRARY="$DEPS_DIR/lib/libvorbis.a" \
            -DVORBISFILE_LIBRARY="$DEPS_DIR/lib/libvorbisfile.a" \
            -DVORBIS_INCLUDE_DIR="$DEPS_DIR/include" \
            -DOPENAL_LIBRARY="$DEPS_DIR/lib/libopenal.a" \
            -DOPENAL_INCLUDE_DIR="$DEPS_DIR/include/AL" \
            -DZSTD_LIBRARY="$DEPS_DIR/lib/libzstd.a" \
            -DZSTD_INCLUDE_DIR="$DEPS_DIR/include" \
            -DGMP_LIBRARY="$DEPS_DIR/lib/libgmp.a" \
            -DGMP_INCLUDE_DIR="$DEPS_DIR/include" \
            -DJSON_LIBRARY="$DEPS_DIR/lib/libjsoncpp.a" \
            -DJSON_INCLUDE_DIR="$DEPS_DIR/include" \
            -DLIBZIP_LIBRARY="$DEPS_DIR/lib/libzip.a" \
            -DLIBZIP_INCLUDE_DIR="$DEPS_DIR/include" \
            -DENABLE_LEVELDB=OFF \
            -DENABLE_POSTGRESQL=OFF \
            -DENABLE_REDIS=OFF \
            -DENABLE_OPENSSL=OFF \
            -DJPEG_INCLUDE_DIR="$DEPS_DIR/include" \
            -DJPEG_LIBRARY="$DEPS_DIR/lib/libjpeg.a" \
            -DPNG_LIBRARY="$DEPS_DIR/lib/libpng16.a" \
            -DPNG_PNG_INCLUDE_DIR="$DEPS_DIR/include" \
            -DCMAKE_EXE_LINKER_FLAGS="-lbz2 $DEPS_DIR/lib/libANGLE_static.a $DEPS_DIR/lib/libEGL_static.a -framework IOSurface" \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_STYLE=Manual \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGN_IDENTITY=- \
            -DCMAKE_XCODE_ATTRIBUTE_ENABLE_HARDENED_RUNTIME=YES \
            -DXCODE_CODE_SIGN_ENTITLEMENTS=../../macos/mod.entitlements \
            -GXcode
          xcodebuild -project luanti.xcodeproj -scheme luanti -configuration Release build

      - name: Validate ANGLE artifact
        working-directory: minetest
        run: |
          set -euo pipefail
          APP="build_xcode/build/Release/luanti.app"
          BIN="$APP/Contents/MacOS/luanti"

          "$BIN" --version
          nm "$BIN" > symbols.txt
          if ! grep -q 'eglGetPlatformDisplay' symbols.txt; then
            echo "ANGLE EGL symbols were not linked into the executable."
            exit 1
          fi

          BAD_DYLIBS="$(otool -L "$BIN" | tail -n +2 | awk '{print $1}' \
            | grep '^/' | grep -Ev '^(/System/Library/|/usr/lib/)' || true)"
          if [ -n "$BAD_DYLIBS" ]; then
            echo "Executable contains non-system absolute dynamic-library paths:"
            echo "$BAD_DYLIBS"
            exit 1
          fi

          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -d --entitlements :- "$APP"

      - name: Pack DMG
        id: dmg
        working-directory: minetest
        env:
          MT_SHA: ${{ steps.mtsha.outputs.sha }}
          ANGLE_SHA: ${{ steps.anglesha.outputs.sha }}
        run: |
          set -euo pipefail
          BASENAME="luanti-macos-arm64-angle-nightly-${MT_SHA}-${ANGLE_SHA}"
          DMG_NAME="${BASENAME}.dmg"
          hdiutil create -ov \
            -volname "Luanti ANGLE Nightly" \
            -srcfolder "build_xcode/build/Release/luanti.app" \
            -format UDZO \
            "$GITHUB_WORKSPACE/$DMG_NAME"
          {
            echo "DMG=$DMG_NAME"
            echo "BASENAME=$BASENAME"
          } >> "$GITHUB_OUTPUT"

      - name: Upload DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dmg.outputs.BASENAME }}
          path: ${{ github.workspace }}/${{ steps.dmg.outputs.DMG }}
          if-no-files-found: error
